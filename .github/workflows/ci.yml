name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The pnpm version is the `packageManager` field of package.json.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm build

  # The contract specs start the hub and the CLI as processes; the token
  # file's rights and Ctrl+C differ by platform, so both run them.
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - run: pnpm measure:startup

  # Rust workspace (docs/rust-migration.md §7). Both feature sets are checked: the
  # default one (with the dev hub) and the release one (--no-default-features, K1).
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      # The toolchain is pinned in rust-toolchain.toml; rustup installs it on first use.
      - run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo clippy --workspace --all-targets --locked --no-default-features -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo test --workspace --locked --no-default-features
      # gecko-dev: the developer build with the dev hub, for tests and contributors.
      # It is never attached to a Release.
      - run: cargo build --release --locked -p gecko
      - uses: actions/upload-artifact@v4
        with:
          name: gecko-dev-${{ runner.os }}
          path: target/release/gecko${{ runner.os == 'Windows' && '.exe' || '' }}
          if-no-files-found: error
          retention-days: 14

  # SignalR trial (docs/signalr-trial.md): the narrow Rust client against the smallest
  # ASP.NET Core hub. The hub stays in CI because the real backend is not ours.
  signalr:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      GECKO_SIGNALR_TEST_HUB: http://127.0.0.1:5199
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: '1.95'
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: spikes/signalr-manual
      - run: dotnet build tests/signalr-hub -nologo -v q
      - name: Start the test hub
        env:
          TEST_HUB_KEEPALIVE_MS: '500'
          TEST_HUB_CLIENT_TIMEOUT_MS: '2000'
        run: |
          dotnet tests/signalr-hub/bin/Debug/net10.0/SignalRTestHub.dll --urls "$GECKO_SIGNALR_TEST_HUB" > hub.log 2>&1 &
          for _ in $(seq 1 60); do
            grep -q '^ready' hub.log && exit 0
            sleep 0.5
          done
          cat hub.log
          exit 1
      - working-directory: spikes/signalr-manual
        run: cargo fmt --check
      - working-directory: spikes/signalr-manual
        run: cargo clippy --all-targets -- -D warnings
      - working-directory: spikes/signalr-manual
        run: cargo test
      - if: ${{ failure() }}
        run: cat hub.log

  verify:
    needs: [checks, test, rust, signalr]
    # A skipped required check counts as passed; this one reports failures.
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every job passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "checks, test, rust, signalr: $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              exit 1
            fi
          done
