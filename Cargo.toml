# Rust workspace of the gecko CLI (spec §7).
[workspace]
resolver = "3"
# An explicit list: the glob `crates/*` breaks on nested folders
# (`crates/protocol/wire`). The architecture test (`crates/app/tests/architecture.rs`)
# fails on a crate under `crates/` that is not a member.
members = [
    "crates/app",
    "crates/kernel",
    "crates/protocol/wire",
    "crates/protocol/hub",
    "crates/adapters/hub-client",
    "crates/contexts/binding/contract",
    "crates/contexts/binding/domain",
    "crates/contexts/binding/module",
    "crates/contexts/command/contract",
    "crates/contexts/command/domain",
    "crates/contexts/command/module",
    "crates/dev-hub",
    "crates/testkit",
]

[workspace.package]
version = "0.4.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"
repository = "https://github.com/dolusoft/gecko-cli"

[workspace.dependencies]
gecko-binding-contract = { path = "crates/contexts/binding/contract" }
gecko-binding-domain = { path = "crates/contexts/binding/domain" }
gecko-binding-module = { path = "crates/contexts/binding/module" }
gecko-command-contract = { path = "crates/contexts/command/contract" }
gecko-command-domain = { path = "crates/contexts/command/domain" }
gecko-command-module = { path = "crates/contexts/command/module" }
gecko-dev-hub = { path = "crates/dev-hub" }
gecko-hub-client = { path = "crates/adapters/hub-client" }
gecko-hub-protocol = { path = "crates/protocol/hub" }
gecko-kernel = { path = "crates/kernel" }
gecko-wire = { path = "crates/protocol/wire" }
# Test support; a dev-dependency only, never in a release build.
gecko-testkit = { path = "crates/testkit" }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
# Network stack (spec §7.3): rustls with ring and the operating
# system's verifier; no native-tls, no aws-lc.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
# Codes and secrets of the development hub, from the operating system's source.
getrandom = "0.4"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
# The development hub keeps only a hash of each attach secret; not in release builds.
sha2 = { version = "0.11", default-features = false }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync", "io-util", "io-std", "signal"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# The terminal's width for tables (UX U6).
terminal_size = "0.4"
url = "2"
windows-sys = { version = "0.61", features = ["Win32_Networking_WinSock"] }

[workspace.lints.rust]
# Denied, not forbidden: one Windows call (gecko-hub-client `tcp.rs`) opts in by name.
unsafe_code = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
dbg_macro = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
unwrap_used = "warn"

[profile.release]
codegen-units = 1
lto = true
panic = "abort"
strip = true
