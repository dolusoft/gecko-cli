[package]
name = "gecko"
description = "Remote control of the Gecko web terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "gecko"
path = "src/main.rs"

[features]
# Developer and CI builds carry the development hub; the release workflow builds with
# --no-default-features, so customers get no HTTP server (K1).
default = ["dev-hub"]
dev-hub = ["dep:gecko-dev-hub"]

[dependencies]
gecko-binding-contract.workspace = true
gecko-binding-module.workspace = true
gecko-command-contract.workspace = true
gecko-command-module.workspace = true
gecko-dev-hub = { workspace = true, optional = true }
gecko-hub-client.workspace = true
gecko-hub-protocol.workspace = true
gecko-kernel.workspace = true
gecko-wire.workspace = true
serde.workspace = true
serde_json.workspace = true
terminal_size.workspace = true
tokio.workspace = true
url.workspace = true

[dev-dependencies]
futures-util.workspace = true
gecko-testkit.workspace = true
tokio-tungstenite.workspace = true

[lints]
workspace = true
