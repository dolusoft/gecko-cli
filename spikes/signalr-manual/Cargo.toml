# Hand-written narrow SignalR client, tried against tests/signalr-hub (docs/signalr-trial.md).
# Moves into crates/gecko-hub-client once the workspace exists.
[package]
name = "signalr-manual-trial"
version = "0.0.0"
edition = "2021"
publish = false

[dependencies]
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-platform-verifier = "0.7"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
tokio = { version = "1", features = ["rt", "net", "time", "macros", "sync"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
url = "2"

[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "z"

# Standalone: not a member of the repo workspace.
[workspace]
